name: MixLayer
options:
  bundleIdPrefix: com.santiagoalonso
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: QAMM2A6WRQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  MixLayer:
    type: application
    platform: iOS
    sources:
      - path: MixLayer
    resources:
      - path: MixLayer/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santiagoalonso.mixlayer
        INFOPLIST_FILE: MixLayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  MixLayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MixLayerTests
        excludes:
          - "Fixtures/**"
      - path: MixLayerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MixLayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santiagoalonso.mixlayer.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MixLayer:
    build:
      targets:
        MixLayer: all
        MixLayerTests: [test]
    test:
      targets:
        - MixLayerTests
