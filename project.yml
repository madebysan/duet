name: MixLayer
options:
  bundleIdPrefix: com.santiagoalonso
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: QAMM2A6WRQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  MixLayer:
    type: application
    platform: iOS
    sources:
      - path: MixLayer
        excludes:
          - "PersonalSounds/**"
    resources:
      - path: MixLayer/Resources
    postCompileScripts:
      - name: Copy personal sounds
        basedOnDependencyAnalysis: false
        script: |
          # Loops cut from san's own downloads live in a git-ignored folder; bundle them when present.
          # Never in Release: these loops aren't licensed for the App Store, TestFlight or anyone else.
          if [ "${CONFIGURATION}" != "Debug" ]; then
            echo "Release build; leaving personal sounds out"
            exit 0
          fi
          SRC="${SRCROOT}/MixLayer/PersonalSounds"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/PersonalSounds"
          if [ -d "$SRC" ] && ls "$SRC"/*.m4a >/dev/null 2>&1; then
            mkdir -p "$DEST"
            cp -f "$SRC"/*.m4a "$DEST"/
            echo "Copied $(ls "$SRC"/*.m4a | wc -l | tr -d ' ') personal sounds"
          else
            echo "No personal sounds; building without them"
          fi
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.santiagoalonso.mixlayer
        INFOPLIST_FILE: MixLayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  MixLayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MixLayerTests
        excludes:
          - "Fixtures/**"
      - path: MixLayerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MixLayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.santiagoalonso.mixlayer.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MixLayer:
    build:
      targets:
        MixLayer: all
        MixLayerTests: [test]
    test:
      targets:
        - MixLayerTests
